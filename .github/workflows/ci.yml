name: domain_fleet_gateway

on:
  pull_request:
  push:

jobs:
  humble:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep
          rosdep update

      - name: Install dependencies
        run: |
          mkdir -p /tmp/ws/src
          cp -r "$GITHUB_WORKSPACE" /tmp/ws/src/domain_fleet_gateway
          cd /tmp/ws
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build
        run: |
          cd /tmp/ws
          . /opt/ros/humble/setup.sh
          colcon build --symlink-install --packages-select domain_fleet_gateway

      - name: Test
        run: |
          cd /tmp/ws
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          colcon test --packages-select domain_fleet_gateway
          colcon test-result --verbose
